name: Changelog Check

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'crates/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    name: Verify CHANGELOG.md updated
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG.md was modified
        id: changelog_check
        run: |
          # Get the base commit (main branch or merge base)
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          
          # If we can't determine base, use the previous commit
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^)"
          fi

          # Check if CHANGELOG.md was modified in this PR
          if git diff --name-only "${BASE}...HEAD" | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG_UPDATED=true" >> "$GITHUB_OUTPUT"
            echo "✓ CHANGELOG.md was updated"
          else
            echo "CHANGELOG_UPDATED=false" >> "$GITHUB_OUTPUT"
            echo "✗ CHANGELOG.md was NOT updated"
          fi

      - name: Check if Unreleased section has entries
        id: unreleased_check
        if: steps.changelog_check.outputs.CHANGELOG_UPDATED == 'true'
        run: |
          # Extract the Unreleased section and check if it has meaningful content
          UNRELEASED_SECTION=$(sed -n '/^## \[Unreleased\]/,/^## \[/p' CHANGELOG.md | head -n -1)
          
          # Count lines that are actual content (not empty, not headers, not subsection headers)
          CONTENT_LINES=$(echo "$UNRELEASED_SECTION" | grep -E "^(### |[^ #-]|-)" | grep -v "^###" | wc -l)
          
          if [ "$CONTENT_LINES" -gt 0 ]; then
            echo "HAS_ENTRIES=true" >> "$GITHUB_OUTPUT"
            echo "✓ Unreleased section has entries"
          else
            echo "HAS_ENTRIES=false" >> "$GITHUB_OUTPUT"
            echo "⚠ Unreleased section appears empty"
          fi

      - name: Validate changelog format
        if: steps.changelog_check.outputs.CHANGELOG_UPDATED == 'true'
        run: |
          # Verify CHANGELOG.md follows Keep a Changelog format
          if head -n 20 CHANGELOG.md | grep -q "based on \[Keep a Changelog\]"; then
            echo "✓ CHANGELOG.md format is valid"
          else
            echo "✗ CHANGELOG.md does not reference Keep a Changelog format"
            exit 1
          fi

      - name: Require CHANGELOG.md update
        if: steps.changelog_check.outputs.CHANGELOG_UPDATED == 'false'
        run: |
          echo "::error::CHANGELOG.md must be updated for PRs that modify contract or core code."
          echo ""
          echo "This PR modifies files in 'contracts/' or 'crates/' directories."
          echo "Please update CHANGELOG.md with your changes in the [Unreleased] section."
          echo ""
          echo "Guidelines:"
          echo "- Use appropriate subsections: Added, Changed, Deprecated, Removed, Fixed, Security"
          echo "- Be descriptive about what changed and why"
          echo "- Group changes by contract when relevant"
          echo "- Reference GitHub issues or PRs when applicable"
          echo ""
          echo "See CHANGELOG.md for more details and examples."
          exit 1

      - name: Comment on PR if missing changelog
        if: failure() && steps.changelog_check.outputs.CHANGELOG_UPDATED == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **CHANGELOG.md Update Required**\n\n' +
                    'This PR modifies contract or core code but does not update CHANGELOG.md.\n\n' +
                    'Please add an entry to the [Unreleased] section describing your changes. Use these guidelines:\n\n' +
                    '- **Added**: for new features or contracts\n' +
                    '- **Changed**: for changes in existing functionality\n' +
                    '- **Deprecated**: for soon-to-be removed features\n' +
                    '- **Removed**: for now removed features\n' +
                    '- **Fixed**: for any bug fixes\n' +
                    '- **Security**: for security-related fixes\n\n' +
                    'Example:\n' +
                    '```markdown\n' +
                    '### Fixed\n' +
                    '- **markets**: Corrected fee calculation in place_bet (#' + context.issue.number + ')\n' +
                    '```\n\n' +
                    'See [CHANGELOG.md](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/blob/main/CHANGELOG.md) for more details.'
            })
