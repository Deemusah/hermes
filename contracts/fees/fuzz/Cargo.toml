[package]
name = "fees-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata.cargo-fuzz]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
fees = { path = ".." }
soroban-sdk = { workspace = true, features = ["testutils"] }

[[bin]]
name = "collect_fees"
path = "targets/collect_fees.rs"
